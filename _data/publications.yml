- title: "Memory in LLM-based Multi-agent Systems: Mechanisms, Challenges, and Collective Intelligence"
  url: "https://www.techrxiv.org/users/1007269/articles/1367390-memory-in-llm-based-multi-agent-systems-mechanisms-challenges-and-collective-intelligence"
  authors: "Shanglin Wu, Kai Shu"
  featured: true
  image: "/files/LLM-MAS_Memory.jpg"
  image_alt: "Overview figure of memory in LLM-based multi-agent systems"
  award: true
  venue: "Proceedings of the 30th Pacific-Asia Conference on Knowledge Discovery and Data Mining"
  badges:
    - text: "PAKDD 2026"
    - text: "🏆 Best Survey Paper"
      style: award
  tags: [mas, memory]
  links:
    - label: Paper
      url: "https://www.techrxiv.org/users/1007269/articles/1367390-memory-in-llm-based-multi-agent-systems-mechanisms-challenges-and-collective-intelligence"
      icon: paper
    - label: Repo
      url: "https://github.com/ShanglinWu/LLM-MAS_Memory_Survey"
      icon: code
  abstract: >-
    Memory plays a central role in transforming Large Language Model (LLM)-based agents from reactive predictors into consistent, context-aware collaborators. While LLM-based single-agent memory has been extensively studied, memory in LLM-based Multi-Agent Systems (LLM-MAS) lacks a systematic taxonomy and review. In multi-agent contexts, memory becomes a shared cognitive infrastructure enabling collective intelligence, long-term coordination, and team evolvement. This survey provides the first comprehensive review of memory in LLM-MAS, synthesizing research across memory architectures, management and operations, evaluation, and application, while formalizing key definitions and introducing the design space. Our survey reveals that memory in LLM-MAS is not a trivial extension of single-agent memory but a distinct research frontier-with new challenges in synchronization, access control, scalability, alignment, and safety. By consolidating diverse literature, we aim to provide a foundation for future research in building intelligent, memory-augmented multi-agent systems. In order to follow the latest works in this field, we create and maintain a repository at [https://github.com/ShanglinWu/LLM-MAS_Memory_Survey](https://github.com/ShanglinWu/LLM-MAS_Memory_Survey).
  bibtex: |-
    @inproceedings{wu2026memory,
      title     = {Memory in LLM-based Multi-agent Systems: Mechanisms, Challenges, and Collective Intelligence},
      author    = {Wu, Shanglin and Shu, Kai},
      booktitle = {Proceedings of the 30th Pacific-Asia Conference on Knowledge Discovery and Data Mining (PAKDD)},
      year      = {2026}
    }

- title: "Rethinking Memory Mechanisms of Foundation Agents in the Second Half: A Survey"
  url: "https://arxiv.org/abs/2602.06052"
  authors: "Wei-Chieh Huang, Weizhi Zhang, Yueqing Liang, …, Shanglin Wu, …, Kai Shu"
  featured: true
  image: "/files/memory_survey.png"
  image_alt: "Overview figure of the foundation agent memory survey"
  venue: "Transactions on Machine Learning Research"
  badges:
    - text: "TMLR"
    - text: "Core contributor"
      style: muted
  tags: [memory]
  links:
    - label: arXiv
      url: "https://arxiv.org/abs/2602.06052"
      icon: paper
  abstract: >-
    Research in artificial intelligence is shifting from model innovations and benchmark scores towards problem definition and rigorous real-world evaluation. As the field enters the "second half," the central challenge becomes real utility in long-horizon, dynamic, and user-dependent settings such as agentic coding, deep research, and computer use, where LLM-based agents face context explosion beyond fixed context windows and must continuously accumulate, manage, and selectively reuse information across extended interactions. Memory, with hundreds of papers released in 2025, therefore emerges as the critical solution to fill this utility gap. Beyond passive storage, memory is increasingly the substrate through which agents self-evolve: short-term memory gates which experiences are perceived and abstracted during execution, while long-term memory consolidates them into reusable knowledge and skills, forming the loop through which agents improve from their own experience. In this survey, we provide a unified view of foundation agent memory along three dimensions: memory substrate (internal parametric state and external retrieval-augmented stores), cognitive mechanism (sensory, working, episodic, semantic, and procedural), and memory subject (user-centric personalization and agent-centric experience). We then analyze how memory is operated under single- and multi-agent topologies and highlight learning policies over memory operations, showing how memory management itself is becoming a trainable capability spanning reinforcement-learned context curation, experience consolidation at decision time, and the emerging ecosystem of portable, shareable agent skills. Finally, we review evaluation benchmarks and metrics for memory utility, and outline open challenges and future directions.
  bibtex: |-
    @article{huang2026rethinking,
      title   = {Rethinking Memory Mechanisms of Foundation Agents in the Second Half: A Survey},
      author  = {Huang, Wei-Chieh and Zhang, Weizhi and Liang, Yueqing and others},
      journal = {Transactions on Machine Learning Research},
      year    = {2026}
    }

- title: "Scaling Teams or Scaling Time? Memory Enabled Lifelong Learning in LLM Multi-Agent Systems"
  url: "https://arxiv.org/abs/2604.03295"
  authors: "Shanglin Wu, Yuyang Luo, Yueqing Liang, Kaiwen Shi, Yanfang Ye, Ali Payani, Kai Shu"
  featured: true
  image: "/files/LLMA-Mem.jpg"
  image_alt: "Overview figure of LLMA-Mem"
  badges:
    - text: "Preprint · 2026"
      style: muted
  tags: [mas, memory]
  links:
    - label: arXiv
      url: "https://arxiv.org/abs/2604.03295"
      icon: paper
  abstract: >-
    Large language model (LLM) multi-agent systems can scale along two distinct dimensions: by increasing the number of agents and by improving through accumulated experience over time. Although prior work has studied these dimensions separately, their interaction under realistic cost constraints remains unclear. In this paper, we introduce a conceptual scaling view of multi-agent systems that jointly considers team size and lifelong learning ability, and we study how memory design shares this landscape. To this end, we propose LLMA-Mem, a lifelong memory framework for LLM multi-agent systems under flexible memory topologies. We evaluate LLMA-Mem on MultiAgentBench across coding, research, and database environments. Empirically, LLMA-Mem consistently improves long-horizon performance over baselines while reducing cost. Our analysis further reveals a non-monotonic scaling landscape: larger teams do not always produce better long-term performance, and smaller teams can outperform larger ones when memory better supports the reuse of experience. These findings position memory design as a practical path for scaling multi-agent systems more effectively and more efficiently over time.
  bibtex: |-
    @article{wu2026scaling,
      title   = {Scaling Teams or Scaling Time? Memory Enabled Lifelong Learning in LLM Multi-Agent Systems},
      author  = {Wu, Shanglin and Luo, Yuyang and Liang, Yueqing and Shi, Kaiwen and Ye, Yanfang and Payani, Ali and Shu, Kai},
      journal = {arXiv preprint arXiv:2604.03295},
      year    = {2026}
    }

- title: "Uncertainty in LLM Agents: A Comprehensive Survey"
  url: "https://openreview.net/forum?id=7NoenVN5Ly"
  authors: "Kaiwen Shi, Zheyuan Zhang, Caiqi Zhang, Zheyuan Liu, Zehong Wang, Shanglin Wu, …, Kai Shu, Artem Shelmanov, Yanfang Ye"
  featured: false
  badges: []
  tags: [uncertainty]
  links:
    - label: OpenReview
      url: "https://openreview.net/forum?id=7NoenVN5Ly"
      icon: paper
  abstract: >-
    Large language models (LLMs) and LLM-based agents increasingly support consequential decisions and interact with external systems. As these systems move from generating responses to executing actions, however, a confident but unsupported commitment can become a tool call, environmental action, or state update whose effects propagate through later decisions. This risk makes uncertainty essential for characterizing when a model or agent approaches the boundary of reliable commitment. Because uncertainty must ultimately support decisions rather than remain an isolated measurement, this survey organizes the field through a lifecycle of *Quantification, Calibration, and Utilization*. Within this lifecycle, Quantification represents uncertainty-bearing evidence, whereas Calibration relates that evidence to specified reliability outcomes; together, they provide the basis for Utilization, which determines how uncertainty changes inference, action, or learning. This final stage becomes especially consequential in LLM-based agents because each uncertainty-conditioned intervention can reshape the observations, states, and decisions that follow. Accordingly, this survey analyzes agent uncertainty utilization as closed-loop trajectory control across State Construction, Action Selection, Execution & Feedback, and State Update. Along this loop, uncertainty can repair an insufficient decision state, regulate commitment and computational effort, adapt execution to newly observed consequences, and determine which beliefs or learning signals persist. Because an uncertainty signal may be produced at one stage yet consumed at another, existing methods are organized by signal granularity, uncertainty source stage, and application stage, thereby separating where uncertainty is computed from where it changes agent behavior. This organization, in turn, supports a broader discussion of industrial and consumer deployment, the positive and negative social impacts of uncertainty-aware agents, and open problems in uncertainty propagation, temporal calibration, causal credit assignment, dependence-aware coordination, and intervention-aware evaluation. This survey shifts attention from estimating uncertainty in isolation to using it to prevent unsupported commitments from propagating through agent trajectories.
  bibtex: |-
    @misc{shi2026uncertainty,
      title  = {Uncertainty in LLM Agents: A Comprehensive Survey},
      author = {Shi, Kaiwen and Zhang, Zheyuan and Zhang, Caiqi and Liu, Zheyuan and Wang, Zehong and Wu, Shanglin and Wang, Haoran and Wang, Xufei and Ma, Yijun and Bao, Han and Nelson, Colby and Ma, Xiaoyu and Sun, Weixiang and Shu, Kai and Shelmanov, Artem and Ye, Yanfang},
      year   = {2026},
      url    = {https://openreview.net/forum?id=7NoenVN5Ly}
    }

